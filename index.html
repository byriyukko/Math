<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Math Strike</title>

    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>

<body>
    <audio autoplay loop id="BGmusic">
        <source src="music.flac" type="audio/flac">
    </audio>

    <div id="home" class="content">
        <h1 id="math">Math</h1>
        <h1 id="strike">Strike</h1>

        <button id="play-btn" onclick="showPage('level')">
            PLAY
        </button>
    </div>

    <div id="level" class="content">
        <h1>Difficulty</h1>

        <button class="lvlbtns">LEVEL 1</button>
        <button class="lvlbtns">LEVEL 2</button>
        <button class="lvlbtns">LEVEL 3</button>
    </div>

</body>
</html>
